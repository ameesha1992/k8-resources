apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-dynamic
spec:
  storageClassName: "expense-efs"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: efs-dynamic
  labels:
    purpose: efs-dynamic
spec:
  nodeSelector:
    topology.kubernetes.io/zone: ap-south-1b
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: ebs-dynamic-volume
      mountPath: /usr/share/nginx/html
  volumes:
  - name: ebs-dynamic-volume
    persistentVolumeClaim:
      claimName: ebs-dynamic

---
kind: Service
apiVersion: v1
metadata:
  name: nginx
spec:
  type: LoadBalancer
  selector:
    purpose: efs-dynamic
  ports:
  - name: nginx-svc-port
    protocol: TCP
    port: 80 # service port
    targetPort: 80 # container port
    nodePort: 30007